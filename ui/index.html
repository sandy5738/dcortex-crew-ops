<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crew Ops Advisor</title>

    <!--
      IBM Plex Sans / Mono per docs/UI_DESIGN.md. Plex was designed for
      technical contexts and its tabular figures are genuinely tabular, which
      is what makes the certificate's decimal alignment work.

      These load from Google Fonts. Every rule below carries a real fallback
      stack, so a dead venue network degrades the type rather than the layout.
      Before the demo, consider vendoring the woff2 files locally.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
